<script>
(function(){
var P=JSON.parse(document.getElementById("c").textContent),$=function(i){return document.getElementById(i)},K="painel-op-chave",enc=new TextEncoder();
function de64(s){var x=atob(s),u=new Uint8Array(x.length);for(var i=0;i<x.length;i++)u[i]=x.charCodeAt(i);return u}
function en64(u){var s="";u=new Uint8Array(u);for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
function ler(st){try{return JSON.parse(window[st].getItem(K))}catch(e){return null}}
function gravar(st,v){try{window[st].setItem(K,JSON.stringify(v))}catch(e){}}
function apagar(st){try{window[st].removeItem(K)}catch(e){}}
async function abrir(chave){
  var buf=await crypto.subtle.decrypt({name:"AES-GCM",iv:de64(P.iv)},chave,de64(P.ct));
  var html=await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  document.open();document.write(html);document.close();
}
async function derivar(senha){
  var base=await crypto.subtle.importKey("raw",enc.encode(senha),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:de64(P.salt),iterations:P.it,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"]);
}
async function tentarGuardada(){
  var ok=["sessionStorage","localStorage"];
  for(var i=0;i<ok.length;i++){var g=ler(ok[i]);if(!g)continue;
    if(g.s!==P.salt){apagar(ok[i]);continue}
    try{await abrir(await crypto.subtle.importKey("raw",de64(g.k),"AES-GCM",false,["decrypt"]));return true}catch(e){apagar(ok[i])}}
