async function abrir(raw){
  var ch=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  var buf=await crypto.subtle.decrypt({name:"AES-GCM",iv:de64(P.iv)},ch,de64(P.ct));
  var html=await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  document.open();document.write(html);document.close();
}
async function desembrulhar(senha){
  var base=await crypto.subtle.importKey("raw",enc.encode(senha),"PBKDF2",false,["deriveKey"]);
  var kek=await crypto.subtle.deriveKey({name:"PBKDF2",salt:de64(P.salt),iterations:P.it,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:de64(P.kw.iv),additionalData:enc.encode("kw:"+P.n)},kek,de64(P.kw.ct)));
}
async function tentarGuardada(){
  var ok=["sessionStorage","localStorage"];
  for(var i=0;i<ok.length;i++){var g=ler(ok[i]);if(!g)continue;
    if(g.s!==P.salt){apagar(ok[i]);continue}
    try{await abrir(de64(g.k));return true}catch(e){apagar(ok[i])}}
  return false;
}

};
